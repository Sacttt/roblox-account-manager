<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf79" />
      <stop offset="40%" stop-color="#e5ad43" />
      <stop offset="100%" stop-color="#ab7418" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e5ad43" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#2b3140" stroke-width="2.5" />
  <rect x="9" y="9" width="238" height="238" rx="53" fill="url(#innerGlow)" pointer-events="none" />

  <!-- Stylized Tilted Roblox Cube Brand Geometry -->
  <g transform="translate(128,128) rotate(-14) translate(-128,-128)" filter="url(#dropShadow)">
    <!-- Outer Square Diamond -->
    <rect x="74" y="74" width="108" height="108" rx="26" fill="url(#goldGrad)" stroke="#ffe494" stroke-width="2" />
    <!-- Inner Cutout Window -->
    <rect x="108" y="108" width="40" height="40" rx="9" fill="#0d0f15" stroke="#252a38" stroke-width="2" />
  </g>

  <!-- Sparkle Stars for rich premium aesthetic -->
  <circle cx="198" cy="62" r="3" fill="#ffdf79" />
  <circle cx="58" cy="186" r="2.5" fill="#e5ad43" opacity="0.8" />
</svg>
