<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Roblox Account Manager</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><img src="assets/icon.png" alt=""><span>Roblox Account Manager</span></div>
    <button class="search-trigger" id="open-palette" title="Search accounts and commands (Ctrl K)"></button>
    <div class="window-controls">
      <button id="win-min" aria-label="Minimize"></button>
      <button id="win-max" aria-label="Maximize"></button>
      <button id="win-close" class="close" aria-label="Close"></button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <main class="content">
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>
  <div class="boot" id="boot"><span class="spinner"></span></div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
