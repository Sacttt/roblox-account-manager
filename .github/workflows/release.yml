# Builds and publishes a release on GitHub's servers (no local build, no
# personal token needed).
#
# Two ways to trigger:
#  1) Actions tab -> "Release" -> "Run workflow". Builds and creates a DRAFT
#     release for the version in package.json.
#  2) Push a version tag, e.g.  git tag v2.0.1 && git push origin v2.0.1
#     (bump "version" in package.json to match first).
#
# The draft contains the installer, the portable exe, latest.yml (used by the
# in-app updater) and the blockmap. Publish it from the Releases page.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
