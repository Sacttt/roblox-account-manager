# Build + publish the app on GitHub's servers (no local build, no personal token).
#
# Two ways to trigger:
#  1) One click: Actions tab -> "Release" -> "Run workflow". Builds the installer
#     and creates a DRAFT release for the version in package.json.
#  2) Push a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1
#
# It uses the built-in GITHUB_TOKEN — nothing to configure.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
