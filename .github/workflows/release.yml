# Optional: build + publish the app on GitHub's servers instead of your PC.
# Trigger it by pushing a version tag, e.g.:
#     git tag v1.0.1
#     git push origin v1.0.1
# GitHub then builds the Windows installer and publishes the release for you.
# No personal token needed — it uses the built-in GITHUB_TOKEN.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
