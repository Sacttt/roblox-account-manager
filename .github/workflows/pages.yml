# Publishes the project website (the website/ folder) to GitHub Pages.
# Works with both GitHub Pages source modes:
# 1. GitHub Actions (via actions/deploy-pages)
# 2. Branch deploy (via gh-pages branch)
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml", "index.html", ".nojekyll"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check, package, and publish the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install lint tools (skips the Electron download)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx eslint website
      - name: Assemble site
        run: |
          mkdir _site
          cp -r website/. _site/
          # Screenshot-script inputs and docs are not part of the site.
          rm -rf _site/demo-avatars _site/README.md
          touch _site/.nojekyll
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages (Actions mode)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
