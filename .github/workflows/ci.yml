# Checks every push and pull request, and builds the Windows app so a
# ready-to-install copy can be downloaded from the run's "Artifacts".
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["website/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: End-to-end tests (Electron under a virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm run test:e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts
          if-no-files-found: ignore

  build-windows:
    name: Build Windows installer and portable app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-account-manager-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
